# YOLOv8n-p2 Training Configuration — v3
# Military Vehicle Detection from Aerial/Drone Imagery
# Optimized for degraded real-world drone footage

# Model
# YOLOv8n standard — P2 head causes native MPS crashes (libc++abi abort)
# Small object sensitivity will be handled by SAHI at inference instead
base_weights: yolov8n.pt
imgsz: 640
device: mps  # Apple Silicon GPU

# Phase 1: Frozen backbone warmup
warmup:
  epochs: 15
  lr0: 0.001
  freeze: 10  # freeze first 10 layers (backbone)
  batch: 8  # reduced for MPS stability with P2 head

# Phase 2: Full fine-tune
finetune:
  epochs: 200
  lr0: 0.01
  lrf: 0.01  # final LR = lr0 * lrf (cosine decay to 0.0001)
  batch: 8  # reduced for MPS stability with P2 head
  optimizer: SGD
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

# Augmentation (aerial-optimized, MPS-safe)
degrees: 180.0  # full rotation — aerial views have no canonical orientation
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.5   # vertical flip — common for overhead
fliplr: 0.5
mosaic: 0.0    # DISABLED — MPS crashes with dense annotations + mosaic
mixup: 0.0     # disabled with mosaic off
copy_paste: 0.0
close_mosaic: 0  # N/A since mosaic is off
label_smoothing: 0.1  # helps with noisy/synthetic labels

# Workers — keep low on MPS to avoid memory pressure
workers: 4

# Export targets
export:
  onnx:
    opset: 12
    simplify: true
    dynamic: false
  tflite:
    int8: true
    nms: true
